<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Precision Block Stack</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090b10'/%3E%3Crect x='6' y='19' width='20' height='6' rx='1.5' fill='%2338bdf8'/%3E%3Crect x='9' y='11' width='14' height='6' rx='1.5' fill='%23818cf8'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-label="Precision Block Stack game canvas"></canvas>

      <header class="hud-top" id="hud-top">
        <div class="score-cluster">
          <div class="score-value" id="score-value">0</div>
          <div class="score-meta">
            <span>BEST <strong id="best-value">0</strong></span>
            <span>WIDTH <strong id="width-value">100%</strong></span>
            <span class="streak-pill" id="streak-pill" hidden>PERFECT ×<span id="streak-value">0</span></span>
          </div>
        </div>

        <div class="audio-controls" role="group" aria-label="Audio reactivity controls">
          <div class="meter-wrap" title="Live audio level">
            <div class="meter-bar" id="meter-bar"></div>
          </div>

          <button type="button" class="ctrl-btn" id="btn-tone" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12h3l2.5-6 4 12 3-8 2.5 2H22" />
            </svg>
            <span>Test Tone</span>
          </button>

          <button type="button" class="ctrl-btn ctrl-icon" id="btn-next-track" title="Switch track (10 presets)" aria-label="Next track">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" x2="19" y1="5" y2="19" />
            </svg>
          </button>

          <button type="button" class="ctrl-btn ctrl-icon" id="btn-sfx" aria-pressed="true" title="Toggle sound (SFX and Test Tone)" aria-label="Toggle sound">
            <svg id="icon-sfx-on" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <svg id="icon-sfx-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="22" x2="16" y1="9" y2="15" />
              <line x1="16" x2="22" y1="9" y2="15" />
            </svg>
          </button>
        </div>
      </header>

      <div class="track-toast" id="track-toast" role="status" aria-live="polite" hidden></div>

      <section class="overlay" id="overlay-start">
        <div class="overlay-panel">
          <h1>Precision Block Stack</h1>
          <p class="overlay-desc">
            Tap or press <kbd>Space</kbd> to drop each moving slab. Overhangs slice away; exact aligns build a streak. Enable <strong>Test Tone</strong> for live WebAudio beat reactivity.
          </p>
          <div class="overlay-actions">
            <button type="button" class="primary-btn" id="btn-start">Start Stacking</button>
            <button type="button" class="secondary-btn" id="btn-start-tone">Start with Test Tone</button>
          </div>
        </div>
      </section>

      <section class="overlay" id="overlay-gameover" hidden>
        <div class="overlay-panel">
          <h2 class="gameover-title">Tower Toppled</h2>
          <div class="gameover-stats">
            <div class="stat-item">
              <span class="stat-label">Score</span>
              <span class="stat-num" id="final-score">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Best</span>
              <span class="stat-num" id="final-best">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Perfect</span>
              <span class="stat-num" id="final-accuracy">0%</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Max Streak</span>
              <span class="stat-num" id="final-streak">0</span>
            </div>
          </div>
          <div class="overlay-actions">
            <button type="button" class="primary-btn" id="btn-restart">Stack Again</button>
          </div>
          <p class="overlay-hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> to restart</p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
